---
deployment:
  tasks:
    - export DEPLOYPATH=/home/kudejaet/public_html

    # ── 1. If Node & npm are available, attempt build; otherwise rely on pre-built dist ──
    - cd /home/kudejaet/repositories/kudeja-client/Kudeja-frontend && /bin/bash -c 'if command -v node &>/dev/null && command -v npm &>/dev/null; then echo "Building frontend with $(node -v)..."; npm ci --production=false && npm run build; else echo "Node.js not in PATH; will use pre-built dist if present."; fi'

    # ── 2. Guard: Verify dist/index.html exists before touching public_html ──
    - /bin/bash -c 'if [ ! -f /home/kudejaet/repositories/kudeja-client/Kudeja-frontend/dist/index.html ]; then echo "ERROR: dist/index.html does not exist! Please build the frontend locally (npm run build in Kudeja-frontend) and push dist or configure Node.js in cPanel."; exit 1; fi'

    # ── 3. Atomically sync dist to public_html ──
    - /bin/bash -c 'if [ -d /home/kudejaet/repositories/kudeja-client/Kudeja-frontend/dist/assets ]; then rm -rf /home/kudejaet/public_html/assets && cp -rf /home/kudejaet/repositories/kudeja-client/Kudeja-frontend/dist/assets /home/kudejaet/public_html/; fi'
    - /bin/cp -rf /home/kudejaet/repositories/kudeja-client/Kudeja-frontend/dist/* /home/kudejaet/public_html/

    # ── 4. Ensure .htaccess is installed in public_html ──
    - /bin/cp -f /home/kudejaet/repositories/kudeja-client/.htaccess /home/kudejaet/public_html/.htaccess

    # ── 5. Trigger restart of backend Node.js Passenger application ──
    - /bin/bash -c 'mkdir -p /home/kudejaet/repositories/kudeja-client/kudeja-backend/tmp && touch /home/kudejaet/repositories/kudeja-client/kudeja-backend/tmp/restart.txt || true'
